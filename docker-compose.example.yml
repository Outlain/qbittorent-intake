    #   # Optional comma-separated canonical media boundaries allowed in addition to the primary final root.
    #   TI_FINAL_PARENT_PREFIXES: ${TI_FINAL_PARENT_PREFIXES:?set TI_FINAL_PARENT_PREFIXES explicitly before enabling this override}
