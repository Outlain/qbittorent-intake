    #   TI_NAS_STAGING_LOCATIONS: ${TI_NAS_STAGING_LOCATIONS:?set TI_NAS_STAGING_LOCATIONS explicitly before enabling this override}
    #   # TI_DEFAULT_NAS_STAGING_ID | type: optional string | default: unset
