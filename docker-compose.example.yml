    #   TI_SCANNER_BACKEND: ${TI_SCANNER_BACKEND:?set TI_SCANNER_BACKEND explicitly before enabling this override}
    #   # TI_CLAMD_SOCKET_PATH | type: string | default: "/run/clamav/clamd.sock"
    #   # Private Unix socket shared only with the Torrent Intake ClamD sidecar.
    #   TI_CLAMD_SOCKET_PATH: ${TI_CLAMD_SOCKET_PATH:?set TI_CLAMD_SOCKET_PATH explicitly before enabling this override}
