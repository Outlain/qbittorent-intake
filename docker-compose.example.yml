    #   TI_POST_PROMOTION_ENABLED: ${TI_POST_PROMOTION_ENABLED:?set TI_POST_PROMOTION_ENABLED explicitly before enabling this override}
    #   # TI_POST_PROMOTION_SCRIPT | type: optional string | default: unset
    #   # Absolute executable path under /hooks, mounted read-only. Configure in Portainer or settings.json while stopped. Script files are NOT included in portable backups. Never point this at downloaded content.
    #   TI_POST_PROMOTION_SCRIPT: ${TI_POST_PROMOTION_SCRIPT:?set TI_POST_PROMOTION_SCRIPT explicitly before enabling this override}
    #   # TI_POST_PROMOTION_COPY_ENABLED | type: boolean | default: false
    #   # Enable one-time copies for newly promoted torrents whose final parent matches an enabled copy rule. No match means no copy. Originals are retained and collisions are protected. Choose built-in copying OR a custom script; neither is a continuous folder sync.
    #   TI_POST_PROMOTION_COPY_ENABLED: ${TI_POST_PROMOTION_COPY_ENABLED:?set TI_POST_PROMOTION_COPY_ENABLED explicitly before enabling this override}
    #   # TI_POST_PROMOTION_COPY_DESTINATION | type: optional string | default: unset
    #   # Retained for older settings and backups. This global destination is ignored for newly promoted jobs: configure Copy destination rules instead. Previously queued copies keep their pinned destination and layout.
    #   TI_POST_PROMOTION_COPY_DESTINATION: ${TI_POST_PROMOTION_COPY_DESTINATION:?set TI_POST_PROMOTION_COPY_DESTINATION explicitly before enabling this override}
    #   # TI_POST_PROMOTION_COPY_RULES | type: JSON array | default: []
    #   # Map final-library source roots to existing destinations under /copy-target. The most specific enabled source containing the job's final parent wins; unmatched jobs are not copied. Disabled rules are ignored, so a broader enabled rule can still match. Relative folders are preserved, without a per-job wrapper. Queued jobs retain their saved rule. Maximum 32 rules.
    #   TI_POST_PROMOTION_COPY_RULES: ${TI_POST_PROMOTION_COPY_RULES:?set TI_POST_PROMOTION_COPY_RULES explicitly before enabling this override}
    #   # TI_POST_PROMOTION_DELAY_SECONDS | type: nonnegative integer | default: 5
    #   # Minimum delay after verified promotion before checking again and copying or running the script; not a substitute for move verification. Allowed: 0 through 3600.
    #   TI_POST_PROMOTION_DELAY_SECONDS: ${TI_POST_PROMOTION_DELAY_SECONDS:?set TI_POST_PROMOTION_DELAY_SECONDS explicitly before enabling this override}
    #   # TI_POST_PROMOTION_TIMEOUT_SECONDS | type: nonnegative integer | default: 7200
    #   # Maximum copy or script runtime, followed by a short shutdown grace period. A timeout does not rescan or move the promoted torrent again. Inspect partial copies before retrying. Allowed: 1 through 604800.
    #   TI_POST_PROMOTION_TIMEOUT_SECONDS: ${TI_POST_PROMOTION_TIMEOUT_SECONDS:?set TI_POST_PROMOTION_TIMEOUT_SECONDS explicitly before enabling this override}
    #   # TI_UI_TITLE | type: string | default: "Torrent Intake"
    #   # Heading displayed at the top of the Torrent Intake interface.
    #   TI_UI_TITLE: ${TI_UI_TITLE:?set TI_UI_TITLE explicitly before enabling this override}
    # END GENERATED APPLICATION ENVIRONMENT
    volumes:
      # Local persistent state; host path must already exist and be writable.
      - type: bind
        source: ${TI_DATA_HOST_DIR:-/srv/torrent-intake/data}
        target: /app/data
        bind:
          create_host_path: false
      # qBittorrent must see the same source directory at the SAME container path.
      - type: bind
        source: ${TI_LOCAL_STAGING_HOST_DIR:-/srv/torrent-intake/staging}
        target: /staging-local
        bind:
          create_host_path: false
      - type: bind
        source: ${TI_MEDIA_HOST_DIR:-/srv/torrent-intake/content}
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${TI_EVENTS_HOST_DIR:-/srv/torrent-intake/events}
        target: /events
        bind:
          create_host_path: false
      - type: bind
        source: ${TI_QUARANTINE_HOST_DIR:-/srv/torrent-intake/quarantine}
        target: /quarantine
        bind:
          create_host_path: false
      - type: bind
        source: ${TI_CLAMD_SOCKET_HOST_DIR:-/srv/torrent-intake/socket}
        target: /run/clamav
        bind:
          create_host_path: false
      # OPTIONAL separate archive scratch. Mount the intended storage first;
      # then enable this bind and configure /archive-scratch in Settings & Help.
      # A marker is optional for scratch and must be created on the mounted storage.
      # - type: bind
      #   source: ${TI_ARCHIVE_SCRATCH_HOST_DIR:?set an existing scratch directory}
      #   target: /archive-scratch
      #   bind:
      #     create_host_path: false
      # OPTIONAL copy destination. Each rule destination requires an existing
      # .intake-copy-mount marker. A missing host directory must never be created
      # as a substitute for unavailable mounted storage.
      # - type: bind
      #   source: ${TI_COPY_TARGET_HOST_DIR:?set an existing mounted copy target}
      #   target: /copy-target
      #   bind:
      #     create_host_path: false
      # OPTIONAL trusted script directory; built-in copy rules need no scripts.
      # Native compatibility wrapper: scripts/after-promotion-copy.sh.
      # - type: bind
      #   source: ${TI_HOOKS_HOST_DIR:?set an existing trusted hooks directory}
      #   target: /hooks
      #   read_only: true
      #   bind:
      #     create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=${INTAKE_TMPFS_SIZE:-256m},mode=1777
    ports:
      # Loopback by default. Provide controlled access through a tunnel/proxy.
      - "${TI_UI_PUBLISH_IP:-127.0.0.1}:${TI_UI_HOST_PORT:-8095}:8000"
    networks:
      - intake_network
    depends_on:
      qbittorent-intake-clamd:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${INTAKE_PIDS_LIMIT:-256}
    mem_limit: ${INTAKE_MEMORY_LIMIT:-2g}
    cpus: ${INTAKE_CPU_LIMIT:-2.0}
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_SOFT:-4096}
        hard: ${CONTAINER_NOFILE_HARD:-8192}
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"

  qbittorent-intake-clamd:
    image: ghcr.io/${GITHUB_OWNER:?set GITHUB_OWNER to the image owner}/${GITHUB_REPOSITORY_NAME:-qbittorent-intake}-clamd:${IMAGE_TAG:-latest}
    container_name: qbittorent-intake-clamd
    user: "${INTAKE_UID:-10001}:${INTAKE_GID:-10001}"
    init: true
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}
    read_only: true
    network_mode: none
    environment:
      # Nonnegative integer seconds; minimum effective value 1; default 1800.
      # Startup wait for readable definitions from the external updater.
      DEFINITIONS_WAIT_TIMEOUT: "${DEFINITIONS_WAIT_TIMEOUT:-1800}"
      # Nonnegative integer seconds; minimum effective value 300; default 172800.
      # Maximum daily-definition file age for sidecar startup and health checks.
      DEFINITIONS_MAX_AGE_SECONDS: "${DEFINITIONS_MAX_AGE_SECONDS:-172800}"
      # Integer MiB, 1..4000; default 2000. Parser/expanded-content work ceiling.
      # Does not raise MaxFileSize or StreamMaxLength, both fixed at 2000 MiB.
      CLAMD_MAX_SCAN_SIZE_MIB: "${CLAMD_MAX_SCAN_SIZE_MIB:-2000}"
      # Optional compatibility path values; defaults already match the image.
      # These affect supervisor checks, NOT the image-provided daemon config file.
      # Keep standard paths unless also supplying a matching custom clamd.conf.
      # DEFINITIONS_DIR: "${DEFINITIONS_DIR:-/var/lib/clamav}"
      # CLAMD_SOCKET: "${CLAMD_SOCKET:-/run/clamav/clamd.sock}"
    volumes:
      - type: bind
        source: ${CLAMAV_DEFS_HOST_DIR:-/srv/torrent-intake/definitions}
        target: /var/lib/clamav
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TI_CLAMD_SOCKET_HOST_DIR:-/srv/torrent-intake/socket}
        target: /run/clamav
        bind:
          create_host_path: false
    tmpfs:
      # ClamD stages INSTREAM bytes here, in addition to parser working files.
      # A tmpfs size is a limit; populated pages count toward container memory.
      - /tmp:rw,nosuid,nodev,noexec,size=${CLAMD_TMPFS_SIZE:-4g},mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: ${CLAMD_PIDS_LIMIT:-128}
    mem_limit: ${CLAMD_MEMORY_LIMIT:-8g}
    cpus: ${CLAMD_CPU_LIMIT:-4.0}
    ulimits:
      nofile:
        soft: ${CONTAINER_NOFILE_SOFT:-4096}
        hard: ${CONTAINER_NOFILE_HARD:-8192}
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"

networks:
  intake_network:
    name: ${MEDIA_NETWORK:-intake_network}
    external: true
