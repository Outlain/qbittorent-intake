# Native Rust deployment for Docker Compose or a Portainer Docker Standalone stack.
# Set GITHUB_OWNER, create the host directories, and attach the external network.
# See CONFIGURATION.md. A new database starts paused; configure or restore in the UI.
# These examples do not create qBittorrent, a signature updater, NAS mounts or networks.
services:
  qbittorent-intake:
    image: ghcr.io/${GITHUB_OWNER:?set GITHUB_OWNER to the image owner}/${GITHUB_REPOSITORY_NAME:-qbittorent-intake}:${IMAGE_TAG:-latest}
    container_name: qbittorent-intake
    user: "${INTAKE_UID:-10001}:${INTAKE_GID:-10001}"
    init: true
    restart: ${CONTAINER_RESTART_POLICY:-unless-stopped}
    read_only: true
    stop_grace_period: ${INTAKE_STOP_GRACE_PERIOD:-60s}
    command: ["--host", "0.0.0.0", "--port", "8000"]
    # All application overrides below are OPTIONAL and intentionally commented.
    # Prefer Settings & Help or a restored settings.json. An active TI_* override
    # wins over saved/restored settings, persists at startup, and locks its UI field.
    # To force one value, uncomment environment: and ONLY that TI_* mapping; then
    # set its value in Portainer's stack variables or the Compose host .env file.
    # Do not uncomment this entire inventory. Leave unset optional strings absent.
    # BEGIN GENERATED APPLICATION ENVIRONMENT
    # environment:
    #   # TI_APP_NAME | type: string | default: "torrent-intake"
    #   # Accepted for compatibility with old settings files only; it has no effect. Use UI title to change the page heading.
    #   TI_APP_NAME: ${TI_APP_NAME:?set TI_APP_NAME explicitly before enabling this override}
    #   # TI_DEBUG | type: boolean | default: false
    #   # Enables verbose application logging. Leave disabled for normal operation.
    #   TI_DEBUG: ${TI_DEBUG:?set TI_DEBUG explicitly before enabling this override}
    #   # TI_DATA_DIR | type: string | default: "/app/data"
    #   # Bootstrap container directory containing SQLite, settings, and restore state. Keep its host mount on local SSD storage. Only TI_DATA_DIR in the container environment can relocate it.
    #   TI_DATA_DIR: ${TI_DATA_DIR:?set TI_DATA_DIR explicitly before enabling this override}
    #   # TI_DATABASE_URL | type: string | default: "sqlite:////app/data/torrent_intake.db"
    #   # SQLite database containing jobs, checkpoints, migrations and scanner controls. Only a SQLite file inside TI_DATA_DIR is supported; other database engines are not available.
    #   TI_DATABASE_URL: ${TI_DATABASE_URL:?set TI_DATABASE_URL explicitly before enabling this override}
    #   # TI_QBT_HOST | type: string | default: "http://qbittorrent:8080"
    #   # Private Web API endpoint reachable from Torrent Intake, for example http://qbittorrent:8080 on a shared Docker network. This is separate from the URL you open in your browser.
    #   TI_QBT_HOST: ${TI_QBT_HOST:?set TI_QBT_HOST explicitly before enabling this override}
    #   # TI_QBT_USERNAME | type: string | default: "admin"
    #   # Account name used for authenticated qBittorrent API calls.
    #   TI_QBT_USERNAME: ${TI_QBT_USERNAME:?set TI_QBT_USERNAME explicitly before enabling this override}
    #   # TI_QBT_PASSWORD | type: string | default: "REPLACE_WITH_STRONG_PASSWORD"
    #   # Password used for qBittorrent API authentication. The value is never returned to the UI.
    #   TI_QBT_PASSWORD: ${TI_QBT_PASSWORD:?set TI_QBT_PASSWORD explicitly before enabling this override}
    #   # TI_QBT_VERIFY_CERTIFICATE | type: boolean | default: false
    #   # Validates the qBittorrent HTTPS certificate when TLS is used.
    #   TI_QBT_VERIFY_CERTIFICATE: ${TI_QBT_VERIFY_CERTIFICATE:?set TI_QBT_VERIFY_CERTIFICATE explicitly before enabling this override}
    #   # TI_QBT_REQUEST_TIMEOUT_SECONDS | type: nonnegative integer | default: 20
    #   # Maximum wait for an individual qBittorrent API request, in seconds. Minimum: 1.
    #   TI_QBT_REQUEST_TIMEOUT_SECONDS: ${TI_QBT_REQUEST_TIMEOUT_SECONDS:?set TI_QBT_REQUEST_TIMEOUT_SECONDS explicitly before enabling this override}
